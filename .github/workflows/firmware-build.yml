name: Firmware build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [Accel, CAN-Node, RideHeight]
    steps:
      - uses: actions/checkout@v4

      # Same GCC release that STM32CubeIDE 1.19 bundles.
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.3.Rel1'

      - name: Build ${{ matrix.project }} (Debug)
        run: python3 .github/scripts/build_stm32.py "${{ matrix.project }}" --config Debug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-firmware
          path: ${{ matrix.project }}/build-ci/Debug/*.elf
          if-no-files-found: error
