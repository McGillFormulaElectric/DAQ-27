name: stack/memory analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure sanitizer build
        run: cmake -S sil -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DSIL_SANITIZE=ON
      - name: Build sanitizer targets
        run: cmake --build build-sanitize --parallel 2
      - name: Run ASan/UBSan tests
        run: ctest --test-dir build-sanitize --output-on-failure

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy
      - name: Generate compilation database
        env:
          CC: clang
          CXX: clang++
        run: cmake -S sil -B build-static -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: clang-tidy gate
        run: |
          clang-tidy -p build-static \
            --checks='-*,clang-diagnostic-error,clang-analyzer-*' \
            --warnings-as-errors='clang-analyzer-*' \
            'Core/Src/BoardManager.cpp' 'Core/Src/Wrapper.cpp' \
            'Drivers/MFE26-G4-Drivers/Src/HAL Drivers/IOPin.cpp' \
            'Drivers/MFE26-G4-Drivers/Src/HAL Drivers/SPIDriver.cpp' \
            'Drivers/MFE26-G4-Drivers/Src/HAL Drivers/SPIDevice.cpp' \
            'Drivers/MFE26-G4-Drivers/Src/HAL Drivers/CANMessage.cpp' \
            'Drivers/MFE26-G4-Drivers/Src/HAL Drivers/CANDriver.cpp' \
            'Drivers/MFE26-G4-Drivers/Src/Device Drivers/ADS7066.cpp'
